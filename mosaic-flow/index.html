<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Land Mosaic Flow Model</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0f12;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #mosaic-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 300px;
      position: relative;
      z-index: 1;
    }
    #mosaic-container canvas {
      display: block;
      position: relative;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div id="mosaic-container"></div>
  <script type="module" src="./sketch.js"></script>
</body>
</html>
