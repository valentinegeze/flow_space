<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Land Mosaic Flow Model</title>

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- Leaflet CSS + JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.draw CSS + JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- Chart.js (for Soil Study radar chart) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0f0f12;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ── Tab bar ── */
    #tab-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 36px;
      background: rgba(12, 12, 18, 0.98);
      border-bottom: 1px solid rgba(255,255,255,0.09);
      display: flex; align-items: center; gap: 2px; padding: 0 10px;
      z-index: 10000;
    }
    .tab-btn {
      padding: 4px 15px; background: transparent;
      border: 1px solid transparent; border-radius: 5px;
      color: #777; font-size: 12px; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .tab-btn:hover { color: #ccc; background: rgba(255,255,255,0.05); }
    .tab-btn.active {
      background: rgba(184,224,74,0.1);
      border-color: rgba(184,224,74,0.35);
      color: #b8e04a;
    }
    .tab-divider {
      width: 1px; height: 16px; background: rgba(255,255,255,0.1); margin: 0 4px;
    }
    #tab-title {
      margin-left: 8px; font-size: 12px; color: #555;
      font-style: italic; letter-spacing: 0.02em;
    }

    /* ── View containers ── */
    #mosaic-container, #site-analysis-container, #stream-table-container, #soil-study-container {
      position: fixed;
      top: 36px; left: 0; right: 0; bottom: 0;
    }

    /* Existing mosaic layout */
    #mosaic-container {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 300px;
      z-index: 1;
    }
    #mosaic-container canvas {
      display: block; position: relative; z-index: 0;
    }
    /* Zoom panel slide-in */
    #zoom-panel {
      transition: width 200ms ease, min-width 200ms ease;
    }

    /* Site analysis fills the pane */
    #site-analysis-container {
      display: none;
      z-index: 1;
    }

    #stream-table-container {
      display: none;
      z-index: 1;
    }

    #soil-study-container {
      display: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- Tab bar -->
  <div id="tab-bar">
    <button class="tab-btn active" data-tab="mosaic">Mosaic</button>
    <div class="tab-divider"></div>
    <button class="tab-btn" data-tab="site">&#9672; Site Analysis</button>
    <div class="tab-divider"></div>
    <button class="tab-btn" data-tab="stream-table">Stream Table</button>
    <div class="tab-divider"></div>
    <button class="tab-btn" data-tab="soil-study">Soil Study</button>
    <span id="tab-title">Land Mosaic Flow Model</span>
  </div>

  <!-- Mosaic simulation view -->
  <div id="mosaic-container"></div>

  <!-- Site analysis view (Leaflet map + parcel workflow) -->
  <div id="site-analysis-container"></div>

  <!-- Stream Table: percolation explorer + empirical upload -->
  <div id="stream-table-container"></div>

  <!-- Soil Study: Paradise CA / Camp Fire case study -->
  <div id="soil-study-container"></div>

  <!-- Main simulation sketch -->
  <script type="module" src="./sketch.js"></script>

  <!-- Tab switching -->
  <script type="module">
    import { initTabs } from './tabs.js';
    initTabs();
  </script>
</body>
</html>
