<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Land Mosaic Flow Model</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- Leaflet CSS + JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.draw CSS + JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- Chart.js (for Soil Study radar chart) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Theme -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Step navigation -->
  <div id="step-bar">
    <button class="step-btn active unlocked" data-step="site">
      <span class="step-num">1</span>Delineate Site
    </button>
    <div class="step-connector"></div>
    <button class="step-btn" data-step="mosaic">
      <span class="step-num">2</span>Model Fire
    </button>
    <div class="step-connector"></div>
    <button class="step-btn" data-step="soil-study">
      <span class="step-num">3</span>Analyze Burn Scar
    </button>
    <span id="step-title">Land Mosaic Flow Model</span>
  </div>

  <!-- Entry fork: pick between delineating a real parcel or jumping straight in
       with a randomized landscape. Sits above Step 1 and dismisses once the user
       picks a path. -->
  <div id="entry-fork" class="entry-fork">
    <div class="entry-fork-inner">
      <div class="entry-fork-title">Where do you want to start?</div>
      <div class="entry-fork-cards">
        <button class="entry-fork-card" data-fork="delineate">
          <div class="entry-fork-card-num">A</div>
          <div class="entry-fork-card-title">Delineate a site</div>
          <div class="entry-fork-card-body">Draw a parcel on a map, pull NLCD land-cover data, and run the fire model on a real landscape.</div>
        </button>
        <button class="entry-fork-card" data-fork="randomize">
          <div class="entry-fork-card-num">B</div>
          <div class="entry-fork-card-title">Randomize a landscape</div>
          <div class="entry-fork-card-body">Skip the map. Generate a synthetic patch mosaic and go straight to the fire model.</div>
        </button>
      </div>
    </div>
  </div>

  <!-- Step 1: Delineate Site -->
  <div id="site-analysis-container"></div>

  <!-- Step 2: Model Fire -->
  <div id="mosaic-container"></div>

  <!-- Step 3: Analyze Burn Scar -->
  <div id="soil-study-container"></div>

  <!-- Main simulation sketch -->
  <script type="module" src="./sketch.js"></script>

  <!-- Step switching -->
  <script type="module">
    import { initTabs } from './tabs.js';
    initTabs();
  </script>
</body>
</html>
