<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percolation Explorer — Land Mosaic</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0d0d14;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #c8c8d8;
    }

    /* ════════ Top Bar ════════ */
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 36px;
      background: rgba(12, 12, 18, 0.98);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 10px; padding: 0 14px;
      z-index: 1000;
    }
    #top-bar .title {
      font-size: 12px; color: #999; letter-spacing: 0.04em;
    }
    #top-bar .back-link {
      font-size: 11px; color: #6a9; text-decoration: none;
      padding: 3px 10px; border: 1px solid rgba(100,170,150,0.3);
      border-radius: 4px;
    }
    #top-bar .back-link:hover { background: rgba(100,170,150,0.1); }

    /* ════════ Main Layout ════════ */
    #main {
      position: fixed; top: 36px; left: 0; right: 0; bottom: 56px;
      display: flex;
    }

    /* ── Left Panel: Mosaic Map ── */
    #left-panel {
      flex: 1 1 35%;
      min-width: 250px;
      display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.06);
      position: relative;
    }
    #left-panel .overlay-toggles {
      position: absolute; top: 8px; left: 8px; z-index: 10;
      display: flex; gap: 8px;
    }
    .overlay-toggle {
      display: flex; align-items: center; gap: 4px;
      background: rgba(15,15,25,0.8); padding: 3px 8px;
      border-radius: 4px; font-size: 10px; color: #999;
      cursor: pointer;
    }
    .overlay-toggle input { width: 12px; height: 12px; accent-color: #7a9; }
    #mosaic-canvas {
      flex: 1; width: 100%; display: block; cursor: crosshair;
    }
    #scale-bar {
      height: 40px; padding: 6px 14px;
      display: flex; align-items: center; gap: 10px;
      background: rgba(12,12,18,0.95);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    #scale-bar label { font-size: 10px; color: #888; white-space: nowrap; }
    #scale-bar input[type="range"] { flex: 1; accent-color: #99aa55; }

    /* ── Center Panel ── */
    #center-panel {
      flex: 0 0 280px;
      display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.06);
      overflow-y: auto;
    }
    #phi-display {
      text-align: center; padding: 20px 10px 10px;
    }
    #phi-value {
      font-size: 48px; font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: #e8e8f0;
    }
    #phi-symbol {
      font-size: 14px; color: #888; margin-bottom: 4px; display: block;
    }
    #phi-label {
      font-size: 12px; margin-top: 6px;
      transition: color 0.2s;
    }

    /* Threshold slider */
    #threshold-section {
      padding: 14px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .slider-row {
      display: flex; align-items: center; gap: 8px; margin-top: 6px;
    }
    .slider-row input[type="range"] { flex: 1; accent-color: #cc8844; }
    .slider-row .val { font-size: 11px; color: #aaa; min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
    .section-label {
      font-size: 11px; color: #888; letter-spacing: 0.04em; text-transform: uppercase;
    }

    /* S-curve chart */
    #scurve-wrap {
      flex: 1; min-height: 160px; padding: 8px;
    }
    #scurve-canvas { width: 100%; height: 100%; display: block; }

    /* Mode toggle */
    #mode-section {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; gap: 4px;
    }
    .mode-btn {
      flex: 1; padding: 6px 0; text-align: center;
      background: transparent; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px; color: #888; font-size: 11px;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .mode-btn:hover { color: #ccc; border-color: rgba(255,255,255,0.25); }
    .mode-btn.active {
      background: rgba(200,140,60,0.15);
      border-color: rgba(200,140,60,0.45);
      color: #dda855;
    }

    /* New landscape button */
    #util-section {
      padding: 8px 16px 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    #new-landscape-btn {
      width: 100%; padding: 7px 0;
      background: rgba(90,90,120,0.3); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px; color: #aaa; font-size: 11px;
      cursor: pointer; font-family: inherit;
    }
    #new-landscape-btn:hover { background: rgba(90,90,120,0.5); color: #ddd; }

    /* ── Right Panel: Graph ── */
    #right-panel {
      flex: 1 1 35%;
      min-width: 250px;
      display: flex; flex-direction: column;
      position: relative;
    }
    #graph-canvas {
      flex: 1; width: 100%; display: block;
    }
    #edge-bar {
      height: 40px; padding: 6px 14px;
      display: flex; align-items: center; gap: 10px;
      background: rgba(12,12,18,0.95);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    #edge-bar label { font-size: 10px; color: #888; white-space: nowrap; }
    #edge-bar input[type="range"] { flex: 1; accent-color: #6688bb; }
    #edge-weight-value { font-size: 10px; color: #aaa; min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }

    /* ════════ Bottom Bar: Playback ════════ */
    #bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      background: rgba(12, 12, 18, 0.98);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px;
      z-index: 1000;
    }
    .playback-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      color: #ccc; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; font-family: inherit;
    }
    .playback-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    #timestep-label {
      font-size: 12px; color: #999; min-width: 60px;
      font-variant-numeric: tabular-nums;
    }
    #timeline-wrap {
      flex: 1; position: relative; height: 28px;
      display: flex; align-items: center;
    }
    #timeline-scrubber {
      width: 100%; accent-color: #99aa55;
    }
    #timeline-markers {
      position: absolute; top: 0; left: 0; right: 0; height: 100%;
      pointer-events: none;
    }
    .timeline-marker {
      position: absolute; top: 0; bottom: 0; width: 2px;
      display: flex; flex-direction: column; align-items: center;
    }
    .timeline-marker.phi-cross { background: rgba(255,150,50,0.6); }
    .timeline-marker.spanning  { background: rgba(100,200,120,0.6); }
    .marker-label {
      font-size: 8px; color: #ccc; white-space: nowrap;
      position: absolute; top: -12px; transform: translateX(-50%);
    }

    /* ════════ Legend ════════ */
    #legend {
      position: absolute; bottom: 48px; left: 8px; z-index: 10;
      background: rgba(15,15,25,0.85); padding: 6px 10px;
      border-radius: 4px; font-size: 9px;
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 3px;
    }
    .legend-swatch {
      width: 10px; height: 10px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* ════════ Scrollbar ════════ */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    /* ════════ Range input styling ════════ */
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 2px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: #ccc; cursor: pointer;
      border: 2px solid #444;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div id="top-bar">
    <a class="back-link" href="./index.html">&larr; Mosaic</a>
    <span class="title">Percolation Explorer</span>
  </div>

  <!-- Three-panel main area -->
  <div id="main">

    <!-- ═══ LEFT: Mosaic Map ═══ -->
    <div id="left-panel">
      <div class="overlay-toggles">
        <label class="overlay-toggle">
          <input type="checkbox" id="toggle-contours"> Contours
        </label>
        <label class="overlay-toggle">
          <input type="checkbox" id="toggle-soil"> Soil
        </label>
      </div>
      <canvas id="mosaic-canvas"></canvas>

      <!-- Legend -->
      <div id="legend"></div>

      <div id="scale-bar">
        <label>landscape</label>
        <input type="range" id="scale-slider" min="0" max="1" step="0.01" value="0">
        <label>tree-to-tree</label>
      </div>
    </div>

    <!-- ═══ CENTER: Order Parameter φ ═══ -->
    <div id="center-panel">
      <div style="padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.05);">
        <button id="stream-table-upload-btn" style="width:100%;padding:6px 0;background:rgba(80,200,180,0.12);border:1px solid rgba(80,200,180,0.3);border-radius:4px;color:#50c8b4;font-size:11px;cursor:pointer;font-family:inherit;">Load stream table data</button>
        <div id="stream-table-status" style="font-size:10px;color:#666;margin-top:4px;min-height:14px;"></div>
      </div>

      <div id="phi-display">
        <span id="phi-symbol">order parameter &phi;</span>
        <div id="phi-value">0.00</div>
        <div id="phi-label">below threshold — spread stays local</div>
      </div>

      <div id="threshold-section">
        <div class="section-label">Flammability Threshold</div>
        <div class="slider-row">
          <input type="range" id="threshold-slider" min="0" max="0.5" step="0.005" value="0.1">
          <span class="val" id="threshold-value">0.50</span>
        </div>
      </div>

      <div id="scurve-wrap">
        <canvas id="scurve-canvas"></canvas>
      </div>

      <div id="mode-section">
        <button class="mode-btn active" data-mode="fire">Fire</button>
        <button class="mode-btn" data-mode="flood">Flood</button>
        <button class="mode-btn" data-mode="both">Both</button>
      </div>

      <div id="util-section">
        <button id="new-landscape-btn">New Random Landscape</button>
      </div>
    </div>

    <!-- ═══ RIGHT: Tree-to-Tree Graph ═══ -->
    <div id="right-panel">
      <canvas id="graph-canvas"></canvas>
      <div id="edge-bar">
        <label>min edge weight</label>
        <input type="range" id="edge-weight-slider" min="0" max="0.5" step="0.01" value="0.1">
        <span id="edge-weight-value">0.10</span>
      </div>
    </div>

  </div>

  <!-- ═══ BOTTOM: Playback Bar ═══ -->
  <div id="bottom-bar">
    <button class="playback-btn" id="play-btn" title="Play / Pause">&#9654;</button>
    <button class="playback-btn" id="reset-btn" title="Reset">&#8634;</button>
    <span id="timestep-label">t = 0</span>
    <div id="timeline-wrap">
      <input type="range" id="timeline-scrubber" min="0" max="0" value="0">
      <div id="timeline-markers"></div>
    </div>
  </div>

  <!-- Bootstrap module -->
  <script type="module">
    import { init } from './percolation.js';

    // Build legend from patch params
    const legend = document.getElementById('legend');
    const params = {
      grass:    { name: 'Grassland',  color: '#E2E2C1' },
      forest:   { name: 'Forest',     color: '#68AB5F' },
      wetland:  { name: 'Wetland',    color: '#BAD8EA' },
      bare:     { name: 'Bare/Rock',  color: '#B3AC9F' },
      urban:    { name: 'Urban',      color: '#EB0000' },
      corridor: { name: 'Shrubland',  color: '#CCBA7C' },
      water:    { name: 'Water',      color: '#466B9F' },
    };
    for (const [, v] of Object.entries(params)) {
      const item = document.createElement('span');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-swatch" style="background:${v.color}"></span>${v.name}`;
      legend.appendChild(item);
    }

    // Initialize after DOM ready (module scripts are deferred, so DOM is ready)
    let _inited = false;
    function safeInit() { if (!_inited) { _inited = true; init(); } }
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', safeInit);
    } else {
      safeInit();
    }
  </script>
</body>
</html>
